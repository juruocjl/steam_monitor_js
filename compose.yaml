services:
  steam-monitor:
    build:
      context: .
    image: steam-monitor-js:latest
    container_name: steam_monitor
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      PORT: "5555"
      API_BIND_HOST: "127.0.0.1"
      SQLITE_DB_PATH: /app/data/friend_game_history.db
      STEAM_SOCKS_PROXY: "socks5://127.0.0.1:7891"
      STEAM_WEB_COMPATIBILITY_MODE: "true"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
