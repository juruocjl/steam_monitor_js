services:
  steam-monitor:
    build:
      context: .
    image: steam-monitor-js:latest
    container_name: steam_monitor
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      PORT: "5555"
      API_BIND_HOST: "127.0.0.1"
      SQLITE_DB_PATH: /app/data/friend_game_history.db
      STEAM_SOCKS_PROXY: "socks5://127.0.0.1:7891"
      STEAM_WEB_COMPATIBILITY_MODE: "true"
      STEAM_MAX_CONSECUTIVE_FAILURES: "2"
      STEAM_RECOVERY_BASE_MS: "60000"
      STEAM_RECOVERY_MAX_MS: "1800000"
      STEAM_RATE_LIMIT_RECOVERY_BASE_MS: "3600000"
      STEAM_RATE_LIMIT_RECOVERY_MAX_MS: "21600000"
      CLASH_AUTO_FAILOVER_ENABLED: "true"
      CLASH_CONTROLLER_URL: "http://127.0.0.1:9090"
      CLASH_CONTROLLER_SECRET_FILE: "/clash/runtime.yaml"
      CLASH_FAILOVER_GROUP: "🧱 GFW"
      CLASH_FAILOVER_CANDIDATES: "*"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - /home/ubuntu/clashctl/resources:/clash:ro
